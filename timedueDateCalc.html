<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown Timer</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: Arial, sans-serif;

            /* Geometric blue background */
            background-color: #3978c5;
            background-image:
                repeating-conic-gradient(from 30deg,
                    rgba(255, 255, 255, 0.035) 0deg 60deg,
                    transparent 60deg 120deg);
            background-size: 140px 120px;
        }

        .countdown-container {
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        /* Heading */
        .countdown-title {
            font-family: 'Caveat', cursive;
            font-size: clamp(48px, 10vw, 82px);
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }

        /* Timer background */
        .countdown-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

            background: rgba(23, 48, 78, 0.75);
            padding: 0 10px;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 0;
            padding: 5px 0;
        }

        /* Numbers */
        .countdown-number {
            font-size: clamp(42px, 11vw, 110px);
            font-weight: 400;
            line-height: 1.05;
            color: white;
            font-variant-numeric: tabular-nums;
        }

        .seconds {
            color: #f04b83;
        }

        /* Labels */
        .countdown-label {
            color: white;
            font-size: clamp(11px, 3vw, 23px);
            text-transform: uppercase;
        }

        /* Deadline message */
        .countdown-footer {
            background: #284b72;
            color: white;
            padding: 7px 10px;
            font-size: clamp(11px, 2.8vw, 18px);
            margin-top: 53px;
        }

        /* Date picker */
        .date-settings {
            margin-top: 25px;
            color: white;
            text-align: left;
        }

        .date-settings label {
            display: block;
            margin-bottom: 8px;
        }

        .date-settings input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
        }

        @media (max-width: 450px) {
            .countdown-box {
                padding: 8px 3px;
            }

            .countdown-footer {
                margin-top: 30px;
            }
        }



        /* From Uiverse.io by abrahamcalsin */
        .dot-spinner {
            --uib-size: 2.8rem;
            --uib-speed: .9s;
            --uib-color: #183153;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: var(--uib-size);
            width: var(--uib-size);
            /* border: 1px solid; */
        }

        .dot-spinner__dot {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
        }

        .dot-spinner__dot::before {
            content: '';
            height: 20%;
            width: 20%;
            border-radius: 50%;
            background-color: var(--uib-color);
            transform: scale(0);
            opacity: 0.5;
            animation: pulse0112 calc(var(--uib-speed) * 1.111) ease-in-out infinite;
            box-shadow: 0 0 20px rgba(18, 31, 53, 0.3);
        }

        .dot-spinner__dot:nth-child(2) {
            transform: rotate(45deg);
        }

        .dot-spinner__dot:nth-child(2)::before {
            animation-delay: calc(var(--uib-speed) * -0.875);
        }

        .dot-spinner__dot:nth-child(3) {
            transform: rotate(90deg);
        }

        .dot-spinner__dot:nth-child(3)::before {
            animation-delay: calc(var(--uib-speed) * -0.75);
        }

        .dot-spinner__dot:nth-child(4) {
            transform: rotate(135deg);
        }

        .dot-spinner__dot:nth-child(4)::before {
            animation-delay: calc(var(--uib-speed) * -0.625);
        }

        .dot-spinner__dot:nth-child(5) {
            transform: rotate(180deg);
        }

        .dot-spinner__dot:nth-child(5)::before {
            animation-delay: calc(var(--uib-speed) * -0.5);
        }

        .dot-spinner__dot:nth-child(6) {
            transform: rotate(225deg);
        }

        .dot-spinner__dot:nth-child(6)::before {
            animation-delay: calc(var(--uib-speed) * -0.375);
        }

        .dot-spinner__dot:nth-child(7) {
            transform: rotate(270deg);
        }

        .dot-spinner__dot:nth-child(7)::before {
            animation-delay: calc(var(--uib-speed) * -0.25);
        }

        .dot-spinner__dot:nth-child(8) {
            transform: rotate(315deg);
        }

        .dot-spinner__dot:nth-child(8)::before {
            animation-delay: calc(var(--uib-speed) * -0.125);
        }

        @keyframes pulse0112 {

            0%,
            100% {
                transform: scale(0);
                opacity: 0.5;
            }

            50% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* From Uiverse.io by necatimertmetin */
        .z {
            position: absolute;
            font-size: 32px;
            opacity: 0;
        }

        .z-1 {
            animation: swayUpToRight 2s ease-out infinite;
        }

        .z-2 {
            animation: swayUpToRight 2s ease-out 0.5s infinite;
        }

        .z-3 {
            animation: swayUpToRight 2s ease-out 1s infinite;
        }

        .z-4 {
            animation: swayUpToRight 2s ease-out 1.5s infinite;
        }

        @keyframes swayUpToRight {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(80px, -100px) rotate(30deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="countdown-container">

        <h1 class="countdown-title">
            Countdown Timer
        </h1>

        <div class="countdown-box">

            <div class="countdown-item">
                <span class="countdown-number" id="days">0</span>
                <span class="countdown-label">Day</span>
            </div>

            <div class="countdown-item">
                <span class="countdown-number" id="hours">0</span>
                <span class="countdown-label">Hours</span>
            </div>

            <div class="countdown-item">
                <span class="countdown-number" id="minutes">0</span>
                <span class="countdown-label">Minutes</span>
            </div>

            <div class="countdown-item">
                <span class="countdown-number seconds" id="seconds">0</span>
                <span class="countdown-label">Seconds</span>
            </div>

        </div>

        <div class="countdown-footer" id="deadlineMessage">
            Select your due date
        </div>

        <!-- Date settings -->
        <div class="date-settings">
            <label for="dueDate">Set your due date and time:</label>

            <input type="datetime-local" id="dueDate" value="2026-11-03T01:41:41" step="1">
        </div>

        <!-- From Uiverse.io by abrahamcalsin -->
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>

        <!-- From Uiverse.io by necatimertmetin -->
        <div class="sleep-effect" style="border: 1px solid;">

            <div class="z z-1">Z</div>
            <div class="z z-2">Z</div>
            <div class="z z-3">Z</div>
            <div class="z z-4">Z</div>
        </div>


    </div>

    <script>

        const dueDateInput = document.getElementById("dueDate");

        const daysElement = document.getElementById("days");
        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");

        const deadlineMessage = document.getElementById("deadlineMessage");

        // Manila timezone
        const timeZone = "Asia/Manila";

        function updateCountdown() {

            const dueDate = new Date(dueDateInput.value);

            if (!dueDateInput.value || isNaN(dueDate.getTime())) {
                deadlineMessage.textContent = "Select your due date";
                return;
            }

            const now = new Date();

            let difference = dueDate.getTime() - now.getTime();

            // Check if overdue
            if (difference <= 0) {

                difference = Math.abs(difference);

                deadlineMessage.textContent = "DEADLINE HAS PASSED";

            } else {

                const dateFormatter = new Intl.DateTimeFormat("en-GB", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                    timeZone
                });

                const timeFormatter = new Intl.DateTimeFormat("en-GB", {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hourCycle: "h23",
                    timeZone
                });

                const formattedDate = dateFormatter.format(dueDate);
                const formattedTime = timeFormatter.format(dueDate);

                deadlineMessage.textContent =
                    `Time until ${formattedDate}, ${formattedTime} (Cagayan de Oro time)`;
            }

            // Convert milliseconds
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));

            const hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (difference / 1000) % 60
            );

            // Display countdown
            daysElement.textContent = days;
            hoursElement.textContent = hours;
            minutesElement.textContent = minutes;
            secondsElement.textContent = seconds;
        }

        // Update when due date changes
        dueDateInput.addEventListener("change", updateCountdown);

        // Run immediately
        updateCountdown();

        // Update every second
        setInterval(updateCountdown, 1000);

    </script>

</body>

</html>
