<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Notifier App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./node_modules/hover.css/css/hover.css">
    <link rel="stylesheet" href="addedcss.css">
</head>

<body>
    <div class="container container-toggle-hide" id="collapsible-bar">
        <div class="collapsible-bar">
            <div class="title-app-hac">
                <div class="hamburger" id="burger">
                    <img class="hvr-bounce-in" src="./icons/hamburger.svg" alt="harburger.svg" id="hamburger"
                        aria-expanded="false" />
                    <div class="hide-hamburger-menu">
                        <img src="./icons/logo-titleApp.svg" alt="logoTitleApp">
                        <h2>Assignment <br> Notifier</h2>
                    </div>
                </div>

                <div class="home-assTask-calender" id="home-assTask-calender">
                    <div class="dashboardIcon hvr-bounce-in">
                        <img src="./icons/dashboard.svg" alt="dashboard.svg" />
                        <p class="hide-hamburger-menu">Dashboard</p>
                    </div>
                    <div class="AssignmentTask hvr-bounce-in">
                        <img src="./icons/AssignmentTask.svg" alt="AssignmentTask.svg" />
                        <p class="hide-hamburger-menu">All Assignments</p>
                    </div>
                    <div class="calendarSvg hvr-bounce-in">
                        <img src="./icons/calendar.svg" alt="calendarSvg" />
                        <p class="hide-hamburger-menu">Calendar</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="dashboard-container">
            <div class="dashboard-header">
                <div class="dashboard-text hvr-wobble-top">
                    <p>Dashboard</p>
                </div>
                <div class="add-buttons">
                    <div class="add-subject hvr-wobble-top">
                        <img src="./icons/bluePlus.svg" alt="Blueplus.svg" />
                        <p>Add Subject</p>
                    </div>

                    <div class="add-assignment hvr-wobble-top">
                        <img src="./icons/whitePlus.svg" alt="whitePlus.svg" />
                        <p>Add Assignment</p>
                    </div>
                </div>
            </div>

            <div class="stats">
                <div>
                    <p>Total Tasks</p>
                    <p id="total-task">0</p>
                </div>
                <div>
                    <p>Pending</p>
                    <p id="pending-task">0</p>
                </div>
                <div>
                    <p>In Progress</p>
                    <p>0</p>
                </div id="in-progress-task">
                <div>
                    <p>Completed</p>
                    <p>0</p>
                </div>
            </div>

            <div class="status-assignment-container">
                <div class="view-All">
                    <p class="hvr-bob">View All</p>
                </div>

                <!-- sample added assignment data  -->
                <div class="sample-data">
                    <div class="info-status">
                        <div class="sub-img-tAss-ins-due">
                            <img src="" alt=" ">
                            <div>
                                <p class="subject-title-assignment" id="s-ta">Math - Act algebra</p>
                                <p class="instructor" id="instructor">Mr Bungawon</p>
                                <p class="due-date" id="d-date">Sample due date</p>
                            </div>
                        </div>
                        <div class="logo-status">
                            <img src="" alt=" ">
                            <p>Pending</p>
                        </div>
                    </div>

                    <div class="start-action">
                        <p>✏️</p>
                        <p>🗑️</p>
                        <div>
                            <div>
                                <p>▶️</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script type="module" src="./app.js"></script>
</body>

</html>
