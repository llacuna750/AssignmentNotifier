<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Notifier App</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://googleapis.com" rel="stylesheet" />
</head>

<body>
    <!-- collapsible left  bar close container -->
    <div class="collapsibleBarClose">
        <div class="harburger">
            <img src="./icons/hamburger.svg" alt="harburger.svg" />
        </div>
        <div class="dashboardIcon">
            <img src="./icons/dashboard.svg" alt="dashboard.svg" />
        </div>
        <div class="AssignmentTask">
            <img src="./icons/AssignmentTask.svg" alt="AssignmentTask.svg" />
        </div>
        <div class="calendarSvg">
            <img src="./icons/calendar.svg" alt="calendarSvg" />
        </div>
    </div>

    <div class="DashboardContainer">
        <div class="addButtons">
            <!-- add subject container  -->
            <div class="addSubject">
                <img src="./icons/bluePlus.svg" alt="Blueplus.svg" />
                <p>Add Subject</p>
            </div>

            <!-- add assignment container  -->
            <div class="addAssignment">
                <img src="./icons/whitePlus.svg" alt="whitePlus.svg" />
                <p>Add Assignment</p>
            </div>
        </div>
    </div>

    <!-- Give life of web App -->
    <script></script>
</body>

</html>
