<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Notifier App</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <!-- collapsible sidebar container -->
        <div class="collapsible-bar-Close">
            <div class="hamburger hvr-bounce-in">
                <img src="./icons/hamburger.svg" alt="harburger.svg" />
            </div>


            <div class="home-assTask-calender">
                <div class="dashboardIcon hvr-bounce-in">
                    <img src="./icons/dashboard.svg" alt="dashboard.svg" />
                </div>
                <div class="AssignmentTask hvr-bounce-in">
                    <img src="./icons/AssignmentTask.svg" alt="AssignmentTask.svg" />
                </div>
                <div class="calendarSvg hvr-bounce-in">
                    <img src="./icons/calendar.svg" alt="calendarSvg" />
                </div>
            </div>
        </div>

        <div class="dashboard-container">
            <div class="dashboard-header">
                <div class="dashboard-text">
                    <p>Dashboard</p>
                </div>
                <div class="add-buttons">
                    <!-- add subject container  -->
                    <div class="add-subject">
                        <img src="./icons/bluePlus.svg" alt="Blueplus.svg" />
                        <p>Add Subject</p>
                    </div>

                    <!-- add assignment container  -->
                    <div class="add-assignment">
                        <img src="./icons/whitePlus.svg" alt="whitePlus.svg" />
                        <p>Add Assignment</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
