<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Notifier App</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./node_modules/hover.css/css/hover.css">
</head>

<body>
    <!-- <div class="container container-toggle-hide" id="sidebar"> -->
    <div  id="sidebar">
        <div class="collapsible-bar">
            <div class="title-app-hac">
                <div class="hamburger" id="burger">
                    <img class="hvr-bounce-in" src="./images/hamburger.svg" alt="harburger.svg" id="hamburger"  />
                    <div class="hide-hamburger-menu">
                        <img src="./images/logo-titleApp.svg" alt="logoTitleApp">
                        <h2>Assignment <br> Notifier</h2>
                    </div>
                </div>

                <div class="home-assTask-calender" id="home-assTask-calender">
                    <div class="dashboardIcon hvr-bounce-in">
                        <img src="./images/dashboard.svg" alt="dashboard.svg" />
                        <p class="hide-hamburger-menu">Dashboard</p>
                    </div>
                    <div class="AssignmentTask hvr-bounce-in">
                        <img src="./images/AssignmentTask.svg" alt="AssignmentTask.svg" />
                        <p class="hide-hamburger-menu">All Assignments</p>
                    </div>
                    <div class="calendarSvg hvr-bounce-in">
                        <img src="./images/calendar.svg" alt="calendarSvg" />
                        <p class="hide-hamburger-menu">Calendar</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="dashboard-container">
            <div class="dashboard-header">
                <div class="dashboard-text hvr-wobble-top">
                    <p>Dashboard</p>
                </div>
                <div class="add-buttons">
                    <div class="add-subject hvr-wobble-top">
                        <img src="./images/bluePlus.svg" alt="Blueplus.svg" />
                        <p>Add Subject</p>
                    </div>

                    <div class="add-assignment hvr-wobble-top">
                        <img src="./images/whitePlus.svg" alt="whitePlus.svg" />
                        <p>Add Assignment</p>
                    </div>
                </div>
            </div>

            <div class="stats">
                <div>
                    <p>Total Tasks</p>
                    <p id="total-task">0</p>
                </div>
                <div>
                    <p>Pending</p>
                    <p id="pending-task">0</p>
                </div>
                <div>
                    <p>In Progress</p>
                    <p>0</p>
                </div id="in-progress-task">
                <div>
                    <p>Completed</p>
                    <p>0</p>
                </div>
            </div>

            <div class="status-assignment-container">
                <div class="view-All">
                    <p class="hvr-bob">View All</p>
                </div>

                <!-- sample added assignment data  -->
                <div class="sample-data">
                    <div class="info-status">
                        <div class="sub-img-tAss-ins-due">
                            <img src="./images/drVegapunk.jpeg" alt="drVegapunk">
                            <div>
                                <h5 class="subject-title-assignment" id="s-ta">Physics & Theoretical Science -
                                    Mass-energy equivalence (E = mc²)</h5>
                                <p class="instructor" id="instructor">Albert Einstein</p>
                                <p class="due-date" id="d-date">Nov 3, 2026</p>
                            </div>
                        </div>
                        <div class="logo-status">
                            <div class="status-effect">
                                <div class="sleep-animation">
                                    <div class="z z-1">Z</div>
                                    <div class="z z-2">Z</div>
                                    <div class="z z-3">Z</div>
                                    <div class="z z-4">Z</div>
                                </div>
                            </div>
                            <div class="clock-icon-pending">
                                <img src="./images/pending-icon.svg" alt="pending-icon">
                                <p>
                                    <b> Pending</b>
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="start-action">

                        <div class="hvr-bounce-out">
                            <img src="./images/edit-icon.svg" alt="Edit">
                        </div>

                        <div class="hvr-bounce-out">
                            <img src="./images/delete-icon.svg" alt="Delete">
                        </div>

                        <div class="hvr-bounce-out">
                            <img src="./images/play-icon.svg" alt="Play">
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>


    <script type="module" src="./js/sidebar.js"></script>
</body>

</html>
