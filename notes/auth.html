<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In & Sign Up</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth-card">
        <div class="tabs" role="tablist" aria-label="Authentication mode">
            <button type="button" role="tab" id="tab-login" aria-selected="true"  aria-controls="form-login">Log
                In</button>
            <button type="button" role="tab" id="tab-signup" aria-selected="false" aria-controls="form-signup">Sign
                Up</button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="form-login" novalidate>
            <div class="field">
                <label for="login-email">Email</label>
                <input id="login-email" name="email" type="email" autocomplete="username" spellcheck="false"
                    enterkeyhint="next" required />
                <span class="error-msg" aria-live="polite"></span>
            </div>

            <div class="field">
                <label for="login-password">Password</label>
                <div class="password-wrap">
                    <input id="login-password" name="password" type="password" autocomplete="current-password"
                        enterkeyhint="done" required />
                    <button type="button" class="toggle-pw" aria-pressed="false"
                        aria-label="Show password">Show</button>
                </div>
                <span class="error-msg" aria-live="polite"></span>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="form-signup" hidden novalidate>
            <div class="field">
                <label for="signup-name">Full Name</label>
                <input id="signup-name" name="name" type="text" autocomplete="name" enterkeyhint="next" required />
                <span class="error-msg" aria-live="polite"></span>
            </div>

            <div class="field">
                <label for="signup-email">Email</label>
                <input id="signup-email" name="email" type="email" autocomplete="email" spellcheck="false"
                    enterkeyhint="next" required />
                <span class="error-msg" aria-live="polite"></span>
            </div>

            <div class="field">
                <label for="signup-password">Create Password</label>
                <div class="password-wrap">
                    <input id="signup-password" name="new-password" type="password" autocomplete="new-password"
                        minlength="8" enterkeyhint="done" required />
                    <button type="button" class="toggle-pw" aria-pressed="false"
                        aria-label="Show password">Show</button>
                </div>
                <span class="error-msg" aria-live="polite"></span>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <p class="status" id="status-msg" role="status"></p>
    </main>

    <script type="module" src="./js/auth.js"></script>
</body>

</html>
