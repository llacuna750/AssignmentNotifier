<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="./css/authen.css" />
</head>

<body>
    <main class="card">
        <h1>Create an account</h1>
        <p class="subtitle">Get started with your free account.</p>

        <form data-auth-form="signup" novalidate>
            <div class="field">
                <label for="signup-name">Full Name</label>
                <input id="signup-name" name="name" type="text" autocomplete="name" enterkeyhint="next" required />
                <span class="error-text" aria-live="polite"></span>
            </div>

            <div class="field">
                <label for="signup-email">Email</label>
                <input id="signup-email" name="email" type="email" autocomplete="email" spellcheck="false"
                    enterkeyhint="next" required />
                <span class="error-text" aria-live="polite"></span>
            </div>

            <div class="field">
                <label for="signup-password">Create Password</label>
                <div class="password-box">
                    <input id="signup-password" name="password" type="password" autocomplete="new-password"
                        minlength="8" enterkeyhint="done" required />
                    <button type="button" class="toggle-password" aria-pressed="false" aria-label="Show password">
                        Show
                    </button>
                </div>
                <span class="error-text" aria-live="polite"></span>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="status-banner" role="status"></p>

        <p class="switch-page">
            Already have an account? <a href="login.html">Sign in</a>
        </p>
    </main>

    <script src="./js/authen.js" defer></script>
</body>

</html>
